[project]
name = "skillmapper"
version = "0.2.0"
description = "HH.ru integration for exploring recommended vacancies"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings>=2.16.2",
    "requests>=2.34.2",
]

[project.scripts]
skillmapper = "skillmapper.main:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillmapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
